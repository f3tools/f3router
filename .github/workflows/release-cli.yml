name: Release f3rtr CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump before publishing (none = publish current version)"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs');const p='${{ github.workspace }}/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json "${{ github.workspace }}/package.json"
          git commit -m "Release f3rtr $VERSION"
          git tag "cli-v$VERSION"
          git push origin HEAD:main "refs/tags/cli-v$VERSION"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          TAG="${GITHUB_REF_NAME#cli-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag cli-v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install app dependencies (Next.js build runs from repo root)
        working-directory: ${{ github.workspace }}
        run: npm install --no-audit --no-fund

      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESSTOKEN_WEBBOXES_BYPASS_2FA }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "f3rtr@$VERSION" version >/dev/null 2>&1; then
            echo "f3rtr@$VERSION is already published, skipping."
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "cli-v$VERSION" --title "f3rtr $VERSION" --generate-notes || echo "Release cli-v$VERSION already exists, skipping."
