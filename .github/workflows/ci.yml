name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies (Next.js build runs from repo root)
        working-directory: ${{ github.workspace }}
        run: npm install --no-audit --no-fund

      - name: Install and build CLI package
        run: |
          npm install --no-audit --no-fund
          npm run build
